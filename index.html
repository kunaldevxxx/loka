<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loka Cafe Platform</title>
    <meta name="description" content="Smart cafe ordering and discovery platform with personalized menu, 4-step live order tracker, voice ordering, staff KDS, and analytics." />
    <meta property="og:title" content="Loka Cafe Platform" />
    <meta property="og:description" content="Smart cafe ordering and discovery platform with personalized menu, 4-step live order tracker, voice ordering, staff KDS, and analytics." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet" />
  </head>
  <body style="margin: 0; background-color: #faf8f5;">
    <div id="root">
      <div id="initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1c1917; text-align: center; padding: 20px;">
        <div style="width: 56px; height: 56px; border-radius: 18px; background: #d97706; color: white; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 10px 25px rgba(217, 119, 6, 0.3); margin-bottom: 16px;">
          ☕
        </div>
        <div style="font-size: 18px; font-weight: 800; color: #1c1917; letter-spacing: -0.02em;">Loka Cafe Platform</div>
        <div style="font-size: 13px; color: #78716c; margin-top: 6px;">Loading digital menu & dining portal...</div>
        <div id="script-error-msg" style="display: none; margin-top: 16px; padding: 10px 16px; border-radius: 12px; background: #fee2e2; color: #991b1b; font-size: 12px; max-width: 360px;"></div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var errEl = document.getElementById('script-error-msg');
        if (errEl) {
          errEl.style.display = 'block';
          errEl.innerHTML = 'Startup note: ' + (e.message || 'Script initialization');
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
